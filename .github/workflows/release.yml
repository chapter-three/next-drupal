name: release

on:
  push:
    branches:
      - main
  # Manual trigger. A run that fails at startup (a workflow file the runner
  # rejects, an action the repository does not allow) cannot be re-run, and
  # `main` takes no direct pushes, so without this the only way to retry is
  # to merge another pull request.
  workflow_dispatch:

# Default to read-only. Each job widens only what it needs.
permissions:
  contents: read

# Never let two releases run at once, and never cancel one partway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open with the version bump and changelog,
  # built from the conventional commits since the last release. Merging that
  # pull request is what triggers an actual release: this job then tags it and
  # sets releases_created, which gates the publish job below.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The ref check is a security control, not a tidy-up. A manual run lets
    # whoever starts it pick the branch, and both this file and the checked-out
    # code would then come from that branch, while npm's trusted publisher
    # matches on repository and workflow filename rather than on ref. Without
    # this, anyone with write access could publish from a branch nobody
    # reviewed. Releases come from `main` or they do not happen.
    if: >-
      github.repository == 'chapter-three/next-drupal' &&
      github.ref == 'refs/heads/main'
    # No permissions block: both steps authenticate with the app token, so the
    # job's own GITHUB_TOKEN stays at the workflow default of contents: read.
    # The app's permissions are set on the app itself, not here.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # The default GITHUB_TOKEN cannot open a pull request unless the
      # repository allows Actions to create and approve them, and that setting
      # is a single switch covering both. Granting approval to every workflow
      # would undercut the review requirement on `main`, so this uses an app
      # installation token scoped to this repository instead. It also means CI
      # runs on the release pull request without someone first releasing the
      # held runs a GITHUB_TOKEN-authored pull request produces.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes to npm with trusted publishing. There is no npm token: the
  # id-token permission lets the runner mint a short-lived OIDC credential
  # that npm accepts only from this workflow in this repository. Because the
  # repository and the package are both public, npm also records provenance
  # automatically, so no --provenance flag is needed.
  publish:
    needs: release-please
    # Skipping release-please already skips this job, since its output would be
    # empty. The ref check is repeated anyway: this is the job that holds
    # id-token and can publish, so it should not depend on another job's
    # condition to stay on `main`.
    if: >-
      needs.release-please.outputs.releases_created == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Init
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later, which every current Node
      # 24 release ships. This asserts it rather than installing a newer npm,
      # so nothing unpinned is fetched into a job that can publish.
      - name: Verify npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '11.5.1\n%s\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than the 11.5.1 that trusted publishing requires"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `prepare` (tsup) runs as part of publish, so the tarball is built from
      # this checkout rather than from whatever happens to be in dist/.
      - name: Publish to npm
        run: npm publish
        working-directory: packages/next-drupal
